name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk NexoLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexoLauncher-apk
          path: NexoLauncher.apk
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexo Launcher (build ${{ github.run_number }})
          files: NexoLauncher.apk
