name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Preparar clave de firma
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > app/release.jks
          else
            echo "::warning::Sin secreto SIGNING_KEYSTORE: el APK se firma con una clave temporal y no se podrá actualizar encima de otra versión."
          fi
      - name: Compilar
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk NexoLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexoLauncher-apk
          path: NexoLauncher.apk
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexo Launcher (build ${{ github.run_number }})
          files: NexoLauncher.apk
